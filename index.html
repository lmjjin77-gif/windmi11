<style>

<script type="text/plain" id="gsCode">/**
 * 풍차돌리기 매니저 - 시세 조회용 구글 Apps Script 웹앱
 * (설치: 구글시트 → 확장프로그램 → Apps Script → 붙여넣기 → 배포 → 웹앱, 액세스: 모든 사용자)
 * 호출: …/exec?symbols=US:SOXL,US:SOXX,KR:122630
 */
function doGet(e) {
  var p = (e && e.parameter) || {};
  var raw = p.symbols || p.symbol || '';
  var out = { ok: true, time: new Date().toISOString(), data: {} };
  if (!raw) { out.ok = false; out.error = '사용법: ?symbols=US:SOXL,KR:122630'; return json_(out); }
  raw.split(',').map(function (s) { return s.trim(); }).filter(String).forEach(function (sym) {
    try { out.data[sym] = getSymbol_(sym); } catch (err) { out.data[sym] = { ok: false, error: String(err) }; }
  });
  return json_(out);
}
function json_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}
function getSymbol_(sym) {
  var cache = CacheService.getScriptCache();
  var hit = cache.get('wm_' + sym);
  if (hit) return JSON.parse(hit);
  var parts = sym.split(':');
  var market = parts.length > 1 ? parts[0].toUpperCase() : 'US';
  var code = parts.length > 1 ? parts[1] : parts[0];
  var res = null, errs = [];
  if (market === 'KR') {
    try { res = naver_(code); } catch (e1) { errs.push('naver: ' + e1); }
    if (!res) { try { res = yahoo_(code + '.KS'); } catch (e2) { errs.push('yahoo.KS: ' + e2); } }
    if (!res) { try { res = yahoo_(code + '.KQ'); } catch (e3) { errs.push('yahoo.KQ: ' + e3); } }
  } else {
    try { res = yahoo_(code); } catch (e4) { errs.push('yahoo: ' + e4); }
  }
  if (!res) throw new Error(errs.join(' / '));
  res.ok = true; res.symbol = sym; res.market = market;
  try { cache.put('wm_' + sym, JSON.stringify(res), 300); } catch (e5) {}
  return res;
}
function yahoo_(ticker) {
  var url = 'https://query1.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(ticker) + '?range=1y&interval=1d&includePrePost=false';
  var r = UrlFetchApp.fetch(url, { muteHttpExceptions: true, headers: { 'User-Agent': 'Mozilla/5.0' } });
  if (r.getResponseCode() !== 200) throw new Error('HTTP ' + r.getResponseCode());
  var j = JSON.parse(r.getContentText());
  var result = j.chart && j.chart.result && j.chart.result[0];
  if (!result || !result.timestamp) throw new Error('데이터 없음');
  var meta = result.meta || {}, q = result.indicators.quote[0], off = meta.gmtoffset || 0, daily = [];
  for (var i = 0; i < result.timestamp.length; i++) {
    var c = q.close[i];
    if (c === null || c === undefined) continue;
    var d = new Date((result.timestamp[i] + off) * 1000).toISOString().slice(0, 10);
    var o = q.open[i] != null ? q.open[i] : c, h = q.high[i] != null ? q.high[i] : c, l = q.low[i] != null ? q.low[i] : c;
    if (daily.length && daily[daily.length - 1][0] === d) daily.pop();
    daily.push([d, r4_(o), r4_(h), r4_(l), r4_(c)]);
  }
  return { source: 'yahoo', name: meta.shortName || meta.symbol || ticker, currency: meta.currency || '',
    price: meta.regularMarketPrice != null ? r4_(meta.regularMarketPrice) : (daily.length ? daily[daily.length - 1][4] : null), daily: daily };
}
function naver_(code) {
  var url = 'https://fchart.stock.naver.com/sise.nhn?symbol=' + encodeURIComponent(code) + '&timeframe=day&count=300&requestType=0';
  var r = UrlFetchApp.fetch(url, { muteHttpExceptions: true, headers: { 'User-Agent': 'Mozilla/5.0' } });
  if (r.getResponseCode() !== 200) throw new Error('HTTP ' + r.getResponseCode());
  var txt = r.getContentText('EUC-KR');
  var nameM = txt.match(/name="([^"]*)"/);
  var re = /data="(\d{8})\|([\d.]+)\|([\d.]+)\|([\d.]+)\|([\d.]+)\|/g, m, daily = [];
  while ((m = re.exec(txt)) !== null) {
    var d = m[1].slice(0, 4) + '-' + m[1].slice(4, 6) + '-' + m[1].slice(6, 8), c = +m[5];
    if (!c) continue;
    daily.push([d, +m[2] || c, +m[3] || c, +m[4] || c, c]);
  }
  if (!daily.length) throw new Error('데이터 없음');
  return { source: 'naver', name: nameM ? nameM[1] : code, currency: 'KRW', price: daily[daily.length - 1][4], daily: daily };
}
function r4_(x) { return Math.round(x * 10000) / 10000; }
function test() {
  Logger.log(JSON.stringify(getSymbol_('US:SOXL')).slice(0, 500));
  Logger.log(JSON.stringify(getSymbol_('KR:122630')).slice(0, 500));
}
</script>

<script>
'use strict';
/* =========================================================
   풍차돌리기 매니저 v1.0
   - 하락장 대처법 풍차돌리기 (분할 MOC 매도 → 등비 지정가 재매수)
   ========================================================= */
const KEY = 'windmill_mgr_v1';
const GAP_US = [5, 4.5, 4, 3.5, 3, 2.5];
const GAP_KR = [3, 2.7, 2.4, 2.1, 1.8, 1.5];
const ORDER_DAYS = 30; // 기간잔량 예약매수 유효기간(일)

/* ---------- 유틸 ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const uid = () => Math.random().toString(36).slice(2, 10);
const num = v => { const x = parseFloat(String(v).replace(/,/g, '')); return isNaN(x) ? 0 : x; };
function today() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function dObj(s) { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
function dStr(o) { return o.toISOString().slice(0, 10); }
function addDays(s, n) { const o = dObj(s); o.setUTCDate(o.getUTCDate() + n); return dStr(o); }
function isWknd(s) { const w = dObj(s).getUTCDay(); return w === 0 || w === 6; }
function nextTD(s) { let x = addDays(s, 1); while (isWknd(x)) x = addDays(x, 1); return x; }
function addTD(s, n) { let x = s; for (let i = 0; i < n; i++) x = nextTD(x); return x; }
function tdCount(a, b) { if (!a || !b || b <= a) return 0; let n = 0, x = a; while (x < b) { x = nextTD(x); n++; } return n; }
function monday(s) { const o = dObj(s); const w = (o.getUTCDay() + 6) % 7; o.setUTCDate(o.getUTCDate() - w); return dStr(o); }
const md = s => s ? s.slice(5).replace('-', '.') : '';
const maxD = (a, b) => (!a ? b : !b ? a : (a > b ? a : b));
function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2200); }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- 상태 ---------- */
function newItem(o = {}) {
  const m = o.market || 'US';
  return Object.assign({
    id: uid(), name: m === 'US' ? 'SOXL' : '', market: m, krType: 'ETF',
    ticker: m === 'US' ? 'SOXL' : '', indexTicker: m === 'US' ? 'SOXX' : '',
    totalQty: 400, coreQty: 200, slots: 2, sellDays: 5,
    gaps: (m === 'US' ? GAP_US : GAP_KR).slice(), lateEntry: false,
    buyFee: 0, sellFee: 0, sellTax: 0, minGap: 2, avgCost: 0,
    rounds: [], stopped: false, stopPlan: null, stopBuys: [],
    useManual: false, includeCurrentWeek: false,
    manual: { t: {}, i: {}, price: 0 },
    quote: null, idxQuote: null
  }, o);
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.items && s.items.length) return s; } catch (e) { }
  const it = newItem();
  return { webappUrl: '', active: it.id, items: [it] };
}
let S = load();
let TAB = 'dash';
const OPEN = {};
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('저장 실패: ' + e.message); } }
const IT = () => S.items.find(x => x.id === S.active) || S.items[0];
const RD = (it, id) => it.rounds.find(r => r.id === id);

/* ---------- 가격/표시 ---------- */
function tick(it, x) {
  if (it.market === 'US') return 0.01;
  if (it.krType === 'ETF') return x < 2000 ? 1 : 5;
  if (x < 2000) return 1; if (x < 5000) return 5; if (x < 20000) return 10; if (x < 50000) return 50;
  if (x < 200000) return 100; if (x < 500000) return 500; return 1000;
}
function rp(it, x) { if (it.market === 'US') return Math.round(x * 100) / 100; const t = tick(it, x); return Math.round(x / t) * t; }
function fp(it, x, d) { if (x == null || !isFinite(x) || x === 0) return '-'; return it.market === 'US' ? x.toFixed(d ?? 2) : Math.round(x).toLocaleString(); }
function famt(x) { return (x == null || !isFinite(x)) ? '-' : Math.round(x).toLocaleString(); }
function money(it, x) {
  if (x == null || !isFinite(x)) return '-';
  return it.market === 'US' ? (x < 0 ? '-$' : '$') + Math.abs(x).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : Math.round(x).toLocaleString() + '원';
}
const pct = (x, d = 2) => (x == null || !isFinite(x)) ? '-' : (x * 100).toFixed(d) + '%';
const cls = x => x > 0 ? 'pos' : x < 0 ? 'neg' : '';
function curPrice(it) {
  if (it.useManual && num(it.manual.price)) return num(it.manual.price);
  if (it.quote && it.quote.price) return it.quote.price;
  if (num(it.manual.price)) return num(it.manual.price);
  return 0;
}

/* ---------- 계산 ---------- */
const slotQty = it => Math.floor((num(it.totalQty) - num(it.coreQty)) / Math.max(1, num(it.slots)));
function gapFor(it, no) { const g = it.gaps; return it.lateEntry ? g[g.length - 1] : g[Math.min(no - 1, g.length - 1)]; }
function fees(it) { return { bf: num(it.buyFee) / 100, sf: (num(it.sellFee) + num(it.sellTax)) / 100 }; }
function splitQty(total, n) { const b = Math.floor(total / n), rem = total - b * n; return Array.from({ length: n }, (_, i) => b + (i >= n - rem ? 1 : 0)); }
function makeOrders(it, r, avg, qty) {
  if (!avg || !qty) return [];
  const n = Math.max(1, r.sells.length || num(it.sellDays));
  return splitQty(qty, n).map((q, i) => ({ n: i + 1, limit: rp(it, avg * Math.pow(1 - r.gap / 100, i + 1)), qty: q, origQty: q, fd: '', fp: '', fq: '' }));
}

function rc(it, r) {
  const { bf, sf } = fees(it);
  let cq = 0, ca = 0;
  const rows = r.sells.map(s => {
    const q = num(s.q), p = num(s.p), done = p > 0 && q > 0;
    if (done) { cq += q; ca += q * p; }
    return { d: s.d, q, p, done, cq: done ? cq : null, ca: done ? ca : null, avg: done && cq ? ca / cq : null };
  });
  const planQ = r.sells.reduce((a, s) => a + num(s.q), 0);
  const soldQ = cq, amt = ca, avg = cq ? ca / cq : 0;
  const complete = rows.length > 0 && rows.every(x => x.done);
  const avgNet = avg * (1 - sf);
  const price = curPrice(it);
  const prov = !r.orders.length;
  const src = prov ? makeOrders(it, r, avg, planQ) : r.orders;
  const ords = src.map(o => {
    const fq = num(o.fq), fpp = num(o.fp), qty = num(o.qty);
    const open = (fq && fpp) ? Math.max(0, qty - fq) : qty;
    const cost = fpp * (1 + bf);
    const filled = fq > 0 && fpp > 0;
    return {
      ...o, qty, fq: filled ? fq : 0, fp: fpp, open, filled,
      profit: filled ? (avgNet - cost) * fq : null,
      rate: filled ? avgNet / cost - 1 : null,
      blue: !prov && open > 0 && price > 0 && o.limit >= price,
      blueProv: prov && price > 0 && o.limit >= price
    };
  });
  const ex = (r.extras || []).map(e => {
    const q = num(e.q), p = num(e.p), cost = p * (1 + bf);
    return { ...e, q, p, profit: q && p ? (avgNet - cost) * q : null, rate: q && p ? avgNet / cost - 1 : null };
  });
  const filledQ = prov ? 0 : ords.reduce((a, o) => a + o.fq, 0) + ex.reduce((a, e) => a + (e.p ? e.q : 0), 0);
  const buyCost = prov ? 0 : ords.reduce((a, o) => a + o.fq * o.fp * (1 + bf), 0) + ex.reduce((a, e) => a + (e.p ? e.q * e.p * (1 + bf) : 0), 0);
  const fr = prov ? [] : [...ords.filter(o => o.filled).map(o => ({ q: o.fq, profit: o.profit, rate: o.rate })), ...ex.filter(e => e.q && e.p).map(e => ({ q: e.q, profit: e.profit, rate: e.rate }))];
  const profit = fr.reduce((a, x) => a + x.profit, 0);
  const simple = fr.length ? fr.reduce((a, x) => a + x.rate, 0) / fr.length : null;
  const weighted = buyCost ? fr.reduce((a, x) => a + avgNet * x.q, 0) / buyCost - 1 : null;
  const last = ords[ords.length - 1];
  const cover = last && avg ? last.limit / avg : null;
  const vsStart = last && rows[0] && rows[0].p ? last.limit / rows[0].p - 1 : null;
  const openQ = prov ? 0 : ords.reduce((a, o) => a + o.open, 0);
  let status;
  if (r.stopped) status = 'stopped';
  else if (!complete) status = 'selling';
  else if (soldQ > 0 && filledQ >= soldQ) status = 'done';
  else if (r.paused) status = 'paused';
  else status = 'buying';
  const ds = [...ords.filter(o => o.filled && o.fd).map(o => o.fd), ...ex.filter(e => e.d).map(e => e.d)].sort();
  const doneDate = status === 'done' ? (ds[ds.length - 1] || r.sells[r.sells.length - 1]?.d) : null;
  const lastSell = r.sells.length ? r.sells[r.sells.length - 1].d : null;
  const placed = r.placedDate || (lastSell ? nextTD(lastSell) : null);
  const expire = placed ? addDays(placed, ORDER_DAYS) : null;
  return { rows, planQ, soldQ, amt, avg, avgNet, complete, prov, ords, ex, filledQ, buyCost, profit, simple, weighted, cover, vsStart, openQ, status, doneDate, lastSell, placed, expire, proceedsNet: amt * (1 - sf) };
}

/* 편집 후 정리: 체결 전이면 지정가는 매도 기록을 따라 자동 재계산 */
function normalize(it) {
  it.rounds.forEach(r => {
    const anyFill = r.orders.some(o => num(o.fq) && num(o.fp)) || (r.extras || []).length;
    if (anyFill) return;
    const c = rc(it, { ...r, orders: [] });
    if (c.complete) {
      r.orders = makeOrders(it, r, c.avg, c.soldQ);
      if (!r.placedDate) r.placedDate = nextTD(c.lastSell);
    } else { r.orders = []; r.placedDate = ''; }
  });
}

function ic(it) {
  const { bf } = fees(it);
  let sold = 0, bought = 0, cash = 0, profit = 0;
  const rcs = it.rounds.map(r => { const c = rc(it, r); sold += c.soldQ; bought += c.filledQ; cash += c.proceedsNet - c.buyCost; profit += c.profit; return c; });
  const sb = (it.stopBuys || []).filter(x => num(x.q) && num(x.p));
  const sbq = sb.reduce((a, x) => a + num(x.q), 0);
  const sbc = sb.reduce((a, x) => a + num(x.q) * num(x.p) * (1 + bf), 0);
  cash -= sbc;
  const hold = num(it.totalQty) - sold + bought + sbq;
  const unrec = Math.max(0, sold - bought - sbq);
  const price = curPrice(it);
  const evalv = price ? hold * price + cash : null;
  const base = price ? num(it.totalQty) * price : null;
  return { rcs, sold, bought, cash, profit, hold, unrec, price, evalv, base, sbq };
}

/* ---------- 주봉 / 신호 ---------- */
function weekly(daily) {
  const w = [];
  for (const [d, o, h, l, c] of daily || []) {
    const k = monday(d), last = w[w.length - 1];
    if (last && last.k === k) { last.h = Math.max(last.h, h); last.l = Math.min(last.l, l); last.c = c; last.d2 = d; }
    else w.push({ k, d1: d, d2: d, o, h, l, c });
  }
  const avgC = (i, n) => { let s = 0; for (let j = i - n + 1; j <= i; j++) s += w[j].c; return s / n; };
  w.forEach((b, i) => { b.ma5 = i >= 4 ? avgC(i, 5) : null; b.ma30 = i >= 29 ? avgC(i, 30) : null; });
  return w;
}
function pickWeek(it, w) {
  if (!w.length) return null;
  const L = w[w.length - 1];
  const complete = today() > addDays(L.k, 4);
  if (complete || it.includeCurrentWeek) return { ...L, complete };
  return w.length > 1 ? { ...w[w.length - 2], complete: true } : null;
}
function judge(b) {
  if (!b || !b.ma5) return null;
  const { o, c, ma5, ma30 } = b;
  return {
    start: ma30 ? (o < ma30 && c < ma30 && c < o) : null,
    stop: ma30 ? (o > ma30 && c > ma30) : null,
    rec5: o > ma5 && c > ma5,
    under5: c < ma5
  };
}
function sigOne(it, which) {
  const q = which === 't' ? it.quote : it.idxQuote;
  const m = it.manual[which] || {};
  const manualOk = num(m.o) && num(m.c) && num(m.ma5);
  if ((it.useManual || !q) && manualOk) {
    const b = { k: m.d || '', d2: m.d || '', o: num(m.o), c: num(m.c), ma5: num(m.ma5), ma30: num(m.ma30) || null, complete: true };
    return { bar: b, j: judge(b), src: '수동' };
  }
  if (q && q.daily && q.daily.length) {
    const w = weekly(q.daily), b = pickWeek(it, w);
    return { bar: b, j: judge(b), src: '자동', w };
  }
  return { bar: null, j: null, src: '없음' };
}
function signals(it) {
  const t = sigOne(it, 't'), i = it.indexTicker ? sigOne(it, 'i') : { j: null };
  const v = {};
  ['start', 'stop', 'rec5', 'under5'].forEach(k => {
    const a = t.j ? t.j[k] : null, b = i.j ? i.j[k] : null;
    if (a == null && b == null) v[k] = null;
    else if (a == null) v[k] = b; else if (b == null) v[k] = a;
    else v[k] = a === b ? a : 'mixed';
  });
  return { t, i, v };
}

/* ---------- 다음 회차 ---------- */
function slotInfo(it, I) {
  const out = [];
  for (let s = 1; s <= num(it.slots); s++) {
    let last = null, c = null;
    it.rounds.forEach((r, k) => { if (r.slot === s && (!last || r.no > last.no)) { last = r; c = I.rcs[k]; } });
    out.push({ s, last, c, free: !last || c.status === 'done' || c.status === 'stopped', freeDate: c ? (c.doneDate || '') : '' });
  }
  return out;
}
function nextPlan(it, I) {
  const rs = it.rounds;
  const no = rs.length ? Math.max(...rs.map(r => r.no)) + 1 : 1;
  const sl = slotInfo(it, I);
  const free = sl.filter(x => x.free).sort((a, b) => (a.freeDate || '') < (b.freeDate || '') ? -1 : 1);
  const gap = gapFor(it, no);
  if (!free.length) return { no, gap, none: true, sl };
  const slot = free[0];
  const starts = rs.map(r => r.sells[0]?.d).filter(Boolean).sort();
  const lastStart = starts[starts.length - 1];
  let earliest = null, why = '';
  if (!slot.last) {
    if (!rs.length) { earliest = today(); why = '30주선 아래 음봉(시작 신호) 확인 후 출발'; }
    else {
      const prevLast = rs.map(r => r.sells[r.sells.length - 1]?.d).filter(Boolean).sort().pop();
      earliest = prevLast ? nextTD(prevLast) : today();
      why = '직전 회차 5일 매도가 끝난 다음 주 출발';
    }
  } else {
    earliest = maxD(slot.freeDate ? nextTD(slot.freeDate) : today(), lastStart ? addTD(lastStart, num(it.minGap)) : null);
    why = `${slot.last.no}회차 재매수 완료 물량으로 출발 (5주선 아래일 때, 직전 출발과 ${it.minGap}거래일 이상 간격)`;
  }
  return { no, gap, slot: slot.s, earliest, why, sl, lastStart, initial: !slot.last };
}

function likelyFills(it, c) {
  const q = it.quote;
  if (!q || !q.daily || !c.lastSell) return [];
  const lows = q.daily.filter(d => d[0] > c.lastSell).map(d => d[3]);
  if (!lows.length) return [];
  const mn = Math.min(...lows);
  return c.ords.filter(o => o.open > 0 && mn <= o.limit && !o.blue);
}

function chartSvg(it, w) {
  if (!w || w.length < 2) return '';
  const d = w.slice(-40), W = 600, H = 220, P = 6;
  const vals = d.flatMap(b => [b.h, b.l, b.ma5, b.ma30].filter(x => x));
  const mx = Math.max(...vals), mn = Math.min(...vals);
  const y = v => P + (H - 2 * P) * (1 - (v - mn) / (mx - mn || 1));
  const bw = (W - 2 * P) / d.length;
  const x = i => P + bw * i + bw / 2;
  let s = '';
  d.forEach((b, i) => {
    const up = b.c >= b.o, col = up ? '#d23c3c' : '#2457c5';
    s += `<line x1="${x(i)}" x2="${x(i)}" y1="${y(b.h)}" y2="${y(b.l)}" stroke="${col}" stroke-width="1"/>`;
    s += `<rect x="${x(i) - bw * 0.35}" width="${bw * 0.7}" y="${y(Math.max(b.o, b.c))}" height="${Math.max(1, Math.abs(y(b.o) - y(b.c)))}" fill="${col}"/>`;
  });
  const line = (k, col) => { const pts = d.map((b, i) => b[k] ? `${x(i)},${y(b[k])}` : null).filter(Boolean).join(' '); return pts ? `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2"/>` : ''; };
  s += line('ma5', '#e07b00') + line('ma30', '#1d8a4e');
  return `<svg class="ch" viewBox="0 0 ${W} ${H}">${s}<text x="8" y="16" font-size="11" fill="#e07b00">— 5주선</text><text x="70" y="16" font-size="11" fill="#1d8a4e">— 30주선</text></svg>`;
}

  </div>
  <div class="card"><h3>사용 순서</h3><ol class="muted">
   <li>시작 신호(주봉 몸통 전체가 30주선 아래 음봉) 확인 → [대시보드]에서 1회차 출발</li>
   <li>5거래일 동안 매일 MOC로 매도 → 체결가 입력 (또는 종가 자동채우기)</li>
   <li>5일 매도가 끝나면 평균 매도가 기준 지정가 5개가 자동 생성 → 증권사에 기간잔량 지정가로 주문</li>
   <li>다음 주에 2회차 출발. 3회차부터는 재매수가 먼저 끝난 슬롯으로, 5주선 아래일 때 출발</li>
   <li>5주선 회복 → 50%까지 채우고 대기 / 재이탈 → 남은 주문 재개</li>
   <li>주봉 몸통 전체가 30주선 위 안착 → STOP: 미회수 수량 + 차익금으로 5거래일 분할 종가 매수</li></ol></div>`;
}

/* ---------- 동작 ---------- */
const A = {
  tab(k) { TAB = k; render(); window.scrollTo(0, 0); },
  open(id) { OPEN[id] = true; render(); },
  toggle(id) { const it = IT(), r = RD(it, id), c = rc(it, r); OPEN[id] = !(OPEN[id] ?? (c.status !== 'done')); render(); },
  openAll(v) { IT().rounds.forEach(r => OPEN[r.id] = !!v); render(); },
  selItem(id) { S.active = id; render(); },
  addItem() {
    const m = confirm('국내 종목을 추가할까요?\n[확인] 국내  [취소] 미국') ? 'KR' : 'US';
    const it = newItem({ market: m, name: m === 'US' ? 'SOXL' : '새 국내 종목' });
    S.items.push(it); S.active = it.id; TAB = 'set'; render();
  },
  delItem() {
    if (S.items.length < 2) return toast('마지막 종목은 삭제할 수 없습니다');
    if (!confirm('이 종목과 모든 회차 기록을 삭제할까요?')) return;
    S.items = S.items.filter(x => x.id !== S.active); S.active = S.items[0].id; render();
  },
  set(k, v, t) { const it = IT(); it[k] = t === 'number' ? num(v) : v; if (k === 'ticker' || k === 'indexTicker') { it.quote = k === 'ticker' ? null : it.quote; it.idxQuote = k === 'indexTicker' ? null : it.idxQuote; } render(); },
  setMarket(m) { const it = IT(); it.market = m; it.gaps = (m === 'US' ? GAP_US : GAP_KR).slice(); it.quote = it.idxQuote = null; toast('간격표를 ' + (m === 'US' ? '미국' : '국내') + ' 기본값으로 바꿨습니다'); render(); },
  setGap(i, v) { IT().gaps[i] = num(v); render(); },
  resetGaps(m) { IT().gaps = (m === 'US' ? GAP_US : GAP_KR).slice(); render(); },
  setUrl(v) { S.webappUrl = v.trim(); save(); },
  setMan(w, k, v) { const it = IT(); if (w === 'price') it.manual.price = num(v); else { it.manual[w] = it.manual[w] || {}; it.manual[w][k] = k === 'd' ? v : num(v); } render(); },

  startRound() {
    const it = IT(), I = ic(it), np = nextPlan(it, I);
    if (np.none) return toast('사용 가능한 슬롯이 없습니다');
    let d = ($('nsDate') || {}).value || today();
    if (isWknd(d)) d = nextTD(d);
    if (np.lastStart && !np.initial && tdCount(np.lastStart, d) < num(it.minGap) && !confirm(`직전 출발(${md(np.lastStart)})과 ${tdCount(np.lastStart, d)}거래일 차이입니다. 그래도 출발할까요?`)) return;
    const qs = splitQty(slotQty(it), num(it.sellDays));
    const sells = []; let x = d;
    qs.forEach((q, i) => { if (i) x = nextTD(x); sells.push({ d: x, q, p: '' }); });
    const r = { id: uid(), no: np.no, slot: np.slot, gap: np.gap, sells, orders: [], extras: [], paused: false, stopped: false, placedDate: '' };
    it.rounds.push(r); OPEN[r.id] = true; A.autoFill(r.id, true);
    toast(`${np.no}회차 출발 (간격 ${np.gap}%)`); TAB = 'rounds'; render();
  },
  delRound(id) { const it = IT(); if (!confirm('이 회차를 삭제할까요?')) return; it.rounds = it.rounds.filter(r => r.id !== id); render(); },
  setSell(id, i, k, v) {
    const it = IT(), r = RD(it, id);
    const filled = r.orders.some(o => num(o.fq) && num(o.fp));
    if (filled && k !== 'd' && !confirm('이미 재매수 체결이 있는 회차입니다. 매도 기록을 바꿔도 지정가는 다시 계산되지 않습니다. 계속할까요?')) return render();
    r.sells[i][k] = k === 'd' ? v : (v === '' ? '' : num(v)); render();
  },
  addSell(id) { const it = IT(), r = RD(it, id); const l = r.sells[r.sells.length - 1]; r.sells.push({ d: l ? nextTD(l.d) : today(), q: l ? l.q : 0, p: '' }); render(); },
  delSell(id) { const it = IT(), r = RD(it, id); if (r.sells.length > 1) r.sells.pop(); render(); },
  autoFill(id, silent) {
    const it = IT(), r = RD(it, id), q = it.quote;
    if (!q || !q.daily) { if (!silent) toast('시세 데이터가 없습니다. [⟳ 시세]를 먼저 누르세요'); return; }
    const mp = Object.fromEntries(q.daily.map(d => [d[0], d[4]]));
    let n = 0; r.sells.forEach(s => { if (!num(s.p) && mp[s.d]) { s.p = mp[s.d]; n++; } });
    if (!silent) { toast(n ? `${n}일 종가를 채웠습니다` : '채울 종가가 없습니다'); render(); }
  },
  setOrd(id, i, k, v) {
    const it = IT(), r = RD(it, id), o = r.orders[i];
    o[k] = k === 'fd' ? v : (v === '' ? '' : num(v));
    if (k === 'fp' && num(v) && !num(o.fq)) o.fq = o.qty;
    if (k === 'fp' && num(v) && !o.fd) o.fd = today();
    if (k === 'fp' && v === '') { o.fq = ''; o.fd = ''; }
    render();
  },
  bulk(id) {
    const it = IT(), r = RD(it, id);
    const d = $('bd_' + id).value, p = num($('bp_' + id).value);
    if (!p) return toast('체결가를 입력하세요');
    r.orders.forEach(o => { const fq = num(o.fq) && num(o.fp) ? num(o.fq) : 0; const open = num(o.qty) - fq; if (open > 0 && !fq) { o.fd = d; o.fp = p; o.fq = o.qty; } });
    render(); toast('남은 주문을 일괄 체결 처리했습니다');
  },
  recover(id) {
    const it = IT(), r = RD(it, id), c = rc(it, r);
    const half = Math.ceil(c.soldQ / 2);
    let need = half - c.filledQ;
    if (need > 0) {
      const d = $('rd_' + id).value || today(), p = num($('rp_' + id).value);
      if (!p) return toast('매수가를 입력하세요');
      r.extras = r.extras || [];
      r.extras.push({ d, q: need, p, kind: '5주선 회복 50% 채움' });
      for (const o of r.orders) {
        if (need <= 0) break;
        const filled = num(o.fq) && num(o.fp) ? num(o.fq) : 0;
        const open = num(o.qty) - filled;
        if (open <= 0 || filled) continue;
        const take = Math.min(open, need);
        o.qty = num(o.qty) - take; need -= take;
      }
      toast(`${half - c.filledQ}주 추가 매수 후 대기합니다`);
    } else toast('이미 50% 이상 매수 — 추가 매수 없이 대기합니다');
    r.paused = true; render();
  },
  resume(id) { const it = IT(), r = RD(it, id); r.paused = false; toast('남은 지정가 주문을 다시 거세요'); render(); },
  setEx(id, i, k, v) { const it = IT(), r = RD(it, id); r.extras[i][k] = k === 'd' ? v : num(v); render(); },

  stopStart() {
    const it = IT(), I = ic(it);
    if (!I.price) return toast('현재가가 필요합니다');
    if (!confirm('풍차를 종료(STOP)할까요?\n진행 중인 회차의 남은 매도·매수 주문을 모두 멈추고, 미회수 수량 + 차익금으로 5거래일 분할 매수 계획을 만듭니다.')) return;
    it.rounds.forEach((r, k) => { const s = I.rcs[k].status; if (s !== 'done') { r.stopped = true; r.sells = r.sells.filter(x => num(x.p)); } });
    const I2 = ic(it), { bf } = fees(it);
    const total = Math.floor(I2.cash / (I2.price * (1 + bf)));
    it.stopPlan = { date: today(), price: I2.price, unrec: I2.unrec, cash: I2.cash, total };
    let d = isWknd(today()) ? nextTD(today()) : today();
    it.stopBuys = splitQty(Math.max(0, total), num(it.sellDays)).map((q, i) => { if (i) d = nextTD(d); return { d, q, p: '' }; });
    it.stopped = true; TAB = 'dash'; render();
  },
  undoStop() { const it = IT(); if (!confirm('STOP을 취소하고 회차를 다시 진행 상태로 돌릴까요?')) return; it.stopped = false; it.stopBuys = []; it.stopPlan = null; it.rounds.forEach(r => r.stopped = false); render(); },
  setStop(i, k, v) { IT().stopBuys[i][k] = k === 'd' ? v : num(v); render(); },

  async refresh() {
    const it = IT();
    if (!S.webappUrl) { toast('[설정]에서 웹앱 URL을 먼저 입력하세요'); TAB = 'set'; render(); return; }
    const pre = it.market === 'KR' ? 'KR:' : 'US:';
    const syms = [it.ticker, it.indexTicker].filter(Boolean).map(s => pre + s.trim().toUpperCase());
    if (!syms.length) return toast('티커를 입력하세요');
    toast('시세 불러오는 중…');
    try {
      const res = await fetch(S.webappUrl + (S.webappUrl.includes('?') ? '&' : '?') + 'symbols=' + encodeURIComponent(syms.join(',')));
      const j = await res.json();
      const at = new Date().toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      const t = j.data && j.data[syms[0]], ix = syms[1] && j.data && j.data[syms[1]];
      const errs = [];
      if (t && t.ok) it.quote = { price: t.price, daily: t.daily, name: t.name, src: t.source, at }; else errs.push(syms[0] + ': ' + (t ? t.error : '응답 없음'));
      if (syms[1]) { if (ix && ix.ok) it.idxQuote = { price: ix.price, daily: ix.daily, name: ix.name, src: ix.source, at }; else errs.push(syms[1] + ': ' + (ix ? ix.error : '응답 없음')); }
      it.rounds.forEach(r => { if (!r.stopped) A.autoFill(r.id, true); });
      render();
      toast(errs.length ? '일부 실패 — ' + errs.join(' / ') : '시세 갱신 완료');
    } catch (e) { toast('조회 실패: ' + e.message + ' — 직접 입력을 사용하세요'); }
  },
  copyGs() { navigator.clipboard.writeText($('gsCode').textContent).then(() => toast('코드를 복사했습니다'), () => toast('복사 실패 — 직접 선택해 복사하세요')); },
  exportJson() {
    const b = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `풍차돌리기_백업_${today()}.json`; a.click();
  },
  importJson(file) {
    if (!file) return;
    const fr = new FileReader();
    fr.onload = () => { try { const s = JSON.parse(fr.result); if (!s.items) throw new Error('형식 오류'); S = s; render(); toast('복원했습니다'); } catch (e) { toast('복원 실패: ' + e.message); } };
    fr.readAsText(file);
  },
  loadExample() {
    if (!confirm('SOXL 실전 예시(1,600주 중 800주, 회차당 400주) 종목을 새로 추가할까요?')) return;
    const it = newItem({ name: 'SOXL 실전예시', ticker: 'SOXL', indexTicker: 'SOXX', totalQty: 1600, coreQty: 800, slots: 2 });
    const mk = (no, slot, d0, sells, fills, gap) => {
      const sd = []; let d = d0; sells.forEach((p, i) => { if (i) d = nextTD(d); sd.push({ d, q: 80, p }); });
      const r = { id: uid(), no, slot, gap, sells: sd, orders: [], extras: [], paused: false, stopped: false, placedDate: '' };
      const c = rc(it, r);
      if (c.complete) { r.orders = makeOrders(it, r, c.avg, c.soldQ); r.placedDate = nextTD(c.lastSell); }
      (fills || []).forEach((f, i) => { if (f) { r.orders[i].fd = f[0]; r.orders[i].fp = f[1]; r.orders[i].fq = 80; } });
      return r;
    };
    it.rounds = [
      mk(1, 1, '2026-10-19', [98.65, 97.55, 103.24, 82.11, 83.56], [['2026-10-26', 85.79], ['2026-10-30', 82.32], ['2026-10-30', 79.75], ['2026-10-30', 75.77], ['2026-10-30', 71.98]], 5),
      mk(2, 2, '2026-10-26', [90.50, 101.08, 107.35, 102.39, 77.05], [['2026-11-02', 83.72], ['2026-11-02', 83.70], ['2026-11-02', 80.26], ['2026-11-02', 78.37], ['2026-11-02', 76.00]], 4.5),
      mk(3, 1, '2026-11-02', [68.17, 73.12, 66.68, 40.87, 45.97], [['2026-11-09', 48.12], ['2026-11-09', 48.12], ['2026-11-09', 48.12], ['2026-11-09', 48.12], ['2026-11-09', 48.08]], 4),
      mk(4, 2, '2026-11-03', [73.12, 66.68, 40.87, 45.97, 56.20], [['2026-11-10', 52.99], ['2026-11-10', 52.68], ['2026-11-16', 50.11], ['2026-11-16', 49.05], ['2026-11-16', 47.34]], 3.5),
      mk(5, 1, '2026-11-10', [56.06, 66.03, 65.53, 58.32, 48.76], Array(5).fill(['2026-11-17', 48.0881]), 3),
      mk(6, 2, '2026-11-17', [49.07, '', '', '', ''], null, 2.5)
    ];
    // 4회차 매도일: 11.03~11.06, 11.09 (주말 건너뜀)
    S.items.push(it); S.active = it.id; TAB = 'rounds'; render(); toast('실전 예시를 불러왔습니다');
  }
};

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
