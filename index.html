<style>

body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-text-size-adjust:100%}

.kpi .s{font-size:11px;color:var(--sub);margin-top:2px}

.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;font-weight:700;vertical-align:middle}

<script type="text/plain" id="gsCode">/**
 * 풍차돌리기 매니저 - 시세 조회용 구글 Apps Script 웹앱
 * (설치: 구글시트 → 확장프로그램 → Apps Script → 붙여넣기 → 배포 → 웹앱, 액세스: 모든 사용자)
 * 호출: …/exec?symbols=US:SOXL,US:SOXX,KR:122630
 */
function doGet(e) {
  var p = (e && e.parameter) || {};
  var raw = p.symbols || p.symbol || '';
  var range = p.range === 'max' ? 'max' : '1y'; // range=max: 상장 이후 전체 (백테스트용)
  var out = { ok: true, time: new Date().toISOString(), data: {} };
  if (!raw) { out.ok = false; out.error = '사용법: ?symbols=US:SOXL,KR:122630'; return json_(out); }
  raw.split(',').map(function (s) { return s.trim(); }).filter(String).forEach(function (sym) {
    try { out.data[sym] = getSymbol_(sym, range); } catch (err) { out.data[sym] = { ok: false, error: String(err) }; }
  });
  return json_(out);
}
function json_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}
function getSymbol_(sym, range) {
  range = range || '1y';
  var cache = CacheService.getScriptCache();
  var hit = cache.get('wm_' + range + '_' + sym);
  if (hit) return JSON.parse(hit);
  var parts = sym.split(':');
  var market = parts.length > 1 ? parts[0].toUpperCase() : 'US';
  var code = parts.length > 1 ? parts[1] : parts[0];
  var res = null, errs = [];
  if (market === 'KR') {
    try { res = naver_(code, range); } catch (e1) { errs.push('naver: ' + e1); }
    if (!res) { try { res = yahoo_(code + '.KS', range); } catch (e2) { errs.push('yahoo.KS: ' + e2); } }
    if (!res) { try { res = yahoo_(code + '.KQ', range); } catch (e3) { errs.push('yahoo.KQ: ' + e3); } }
  } else {
    try { res = yahoo_(code, range); } catch (e4) { errs.push('yahoo: ' + e4); }
  }
  if (!res) throw new Error(errs.join(' / '));
  res.ok = true; res.symbol = sym; res.market = market;
  try { cache.put('wm_' + range + '_' + sym, JSON.stringify(res), 300); } catch (e5) {}
  return res;
}
function yahoo_(ticker, range) {
  var url = 'https://query1.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(ticker) + (range === 'max' ? '?period1=0&period2=' + Math.floor(Date.now() / 1000) : '?range=1y') + '&interval=1d&includePrePost=false'; // range=max는 월봉으로 바뀌므로 기간을 직접 지정
  var r = UrlFetchApp.fetch(url, { muteHttpExceptions: true, headers: { 'User-Agent': 'Mozilla/5.0' } });
  if (r.getResponseCode() !== 200) throw new Error('HTTP ' + r.getResponseCode());
  var j = JSON.parse(r.getContentText());
  var result = j.chart && j.chart.result && j.chart.result[0];
  if (!result || !result.timestamp) throw new Error('데이터 없음');
  var meta = result.meta || {}, q = result.indicators.quote[0], off = meta.gmtoffset || 0, daily = [];
  for (var i = 0; i < result.timestamp.length; i++) {
    var c = q.close[i];
    if (c === null || c === undefined) continue;
    var d = new Date((result.timestamp[i] + off) * 1000).toISOString().slice(0, 10);
    var o = q.open[i] != null ? q.open[i] : c, h = q.high[i] != null ? q.high[i] : c, l = q.low[i] != null ? q.low[i] : c;
    if (daily.length && daily[daily.length - 1][0] === d) daily.pop();
    daily.push([d, r4_(o), r4_(h), r4_(l), r4_(c)]);
  }
  return { source: 'yahoo', granularity: meta.dataGranularity || '', name: meta.shortName || meta.symbol || ticker, currency: meta.currency || '',
    price: meta.regularMarketPrice != null ? r4_(meta.regularMarketPrice) : (daily.length ? daily[daily.length - 1][4] : null), daily: daily };
}
function naver_(code, range) {
  var url = 'https://fchart.stock.naver.com/sise.nhn?symbol=' + encodeURIComponent(code) + '&timeframe=day&count=' + (range === 'max' ? 10000 : 300) + '&requestType=0';
  var r = UrlFetchApp.fetch(url, { muteHttpExceptions: true, headers: { 'User-Agent': 'Mozilla/5.0' } });
  if (r.getResponseCode() !== 200) throw new Error('HTTP ' + r.getResponseCode());
  var txt = r.getContentText('EUC-KR');
  var nameM = txt.match(/name="([^"]*)"/);
  var re = /data="(\d{8})\|([\d.]+)\|([\d.]+)\|([\d.]+)\|([\d.]+)\|/g, m, daily = [];
  while ((m = re.exec(txt)) !== null) {
    var d = m[1].slice(0, 4) + '-' + m[1].slice(4, 6) + '-' + m[1].slice(6, 8), c = +m[5];
    if (!c) continue;
    daily.push([d, +m[2] || c, +m[3] || c, +m[4] || c, c]);
  }
  if (!daily.length) throw new Error('데이터 없음');
  return { source: 'naver', name: nameM ? nameM[1] : code, currency: 'KRW', price: daily[daily.length - 1][4], daily: daily };
}
function r4_(x) { return Math.round(x * 10000) / 10000; }
function test() {
  Logger.log(JSON.stringify(getSymbol_('US:SOXL')).slice(0, 500));
  Logger.log(JSON.stringify(getSymbol_('KR:122630')).slice(0, 500));
}
</script>

<script>
'use strict';
/* =========================================================
   풍차돌리기 매니저 v2.3
   - 하락장 대처법 풍차돌리기 (분할 MOC 매도 → 등비 지정가 재매수)
   ========================================================= */
const KEY = 'windmill_mgr_v1';
const GAP_US = [5, 4.5, 4, 3.5, 3, 2.5];
const GAP_KR = [3, 2.7, 2.4, 2.1, 1.8, 1.5];
const ORDER_DAYS = 30; // 기간잔량 예약매수 유효기간(일)

/* ---------- 유틸 ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const uid = () => Math.random().toString(36).slice(2, 10);
const num = v => { const x = parseFloat(String(v).replace(/,/g, '')); return isNaN(x) ? 0 : x; };
function today() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function dObj(s) { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
function dStr(o) { return o.toISOString().slice(0, 10); }
function addDays(s, n) { const o = dObj(s); o.setUTCDate(o.getUTCDate() + n); return dStr(o); }
function isWknd(s) { const w = dObj(s).getUTCDay(); return w === 0 || w === 6; }
/* 휴장일 달력 (NYSE 공식 발표, 국내는 KRX 공지·정부 월력요항 기준. 2027년 국내는 예상치) */
const HOL = {
  US: {
    '2026-01-01': '신정', '2026-01-19': '마틴 루터 킹 데이', '2026-02-16': '대통령의 날', '2026-04-03': '성금요일', '2026-05-25': '메모리얼 데이',
    '2026-06-19': '준틴스', '2026-07-03': '독립기념일(대체)', '2026-09-07': '노동절', '2026-11-26': '추수감사절', '2026-12-25': '성탄절',
    '2027-01-01': '신정', '2027-01-18': '마틴 루터 킹 데이', '2027-02-15': '대통령의 날', '2027-03-26': '성금요일', '2027-05-31': '메모리얼 데이',
    '2027-06-18': '준틴스(대체)', '2027-07-05': '독립기념일(대체)', '2027-09-06': '노동절', '2027-11-25': '추수감사절', '2027-12-24': '성탄절(대체)'
  },
  KR: {
    '2026-01-01': '신정', '2026-02-16': '설날 연휴', '2026-02-17': '설날', '2026-02-18': '설날 연휴', '2026-03-02': '삼일절(대체)', '2026-05-01': '노동절',
    '2026-05-05': '어린이날', '2026-05-25': '부처님오신날(대체)', '2026-06-03': '지방선거', '2026-07-17': '제헌절', '2026-08-17': '광복절(대체)',
    '2026-09-24': '추석 연휴', '2026-09-25': '추석', '2026-10-05': '개천절(대체)', '2026-10-09': '한글날', '2026-12-25': '성탄절', '2026-12-31': '연말 휴장',
    '2027-01-01': '신정', '2027-02-08': '설날 연휴', '2027-02-09': '설날(대체)', '2027-03-01': '삼일절', '2027-05-03': '노동절(대체)', '2027-05-05': '어린이날',
    '2027-05-13': '부처님오신날', '2027-07-19': '제헌절(대체)', '2027-08-16': '광복절(대체)', '2027-09-14': '추석 연휴', '2027-09-15': '추석', '2027-09-16': '추석 연휴',
    '2027-10-04': '개천절(대체)', '2027-10-11': '한글날(대체)', '2027-12-27': '성탄절(대체)', '2027-12-31': '연말 휴장'
  }
};
/* 미국 조기폐장일 (뉴욕 시각 13:00 마감) */
const EARLY = { US: { '2026-11-27': 13 * 60, '2026-12-24': 13 * 60, '2027-11-26': 13 * 60 }, KR: {} };
let MK = 'US'; // 현재 종목의 시장 (거래일 계산 기준)
let HCACHE = {};
function holMap(mk) {
  if (HCACHE[mk]) return HCACHE[mk];
  const m = Object.assign({}, HOL[mk] || {});
  ((S.learnHol || {})[mk] || []).forEach(d => { if (!m[d]) m[d] = '휴장(시세 데이터 기준)'; });
  ((S.customHol || {})[mk] || []).forEach(d => { m[d] = m[d] || '직접 추가한 휴장일'; });
  return (HCACHE[mk] = m);
}
const holName = (s, mk = MK) => holMap(mk)[s] || '';
const isClosed = (s, mk = MK) => isWknd(s) || !!holMap(mk)[s];
const firstTD = (s, mk = MK) => isClosed(s, mk) ? nextTD(s, mk) : s;
function nextTD(s, mk = MK) { let x = addDays(s, 1); while (isClosed(x, mk)) x = addDays(x, 1); return x; }
function addTD(s, n, mk = MK) { let x = s; for (let i = 0; i < n; i++) x = nextTD(x, mk); return x; }
function tdCount(a, b) { if (!a || !b || b <= a) return 0; let n = 0, x = a; while (x < b) { x = nextTD(x); n++; } return n; }
function monday(s) { const o = dObj(s); const w = (o.getUTCDay() + 6) % 7; o.setUTCDate(o.getUTCDate() - w); return dStr(o); }
const md = s => s ? s.slice(5).replace('-', '.') : '';
const maxD = (a, b) => (!a ? b : !b ? a : (a > b ? a : b));
/* 시장 현지 날짜·시각 (미국: 뉴욕, 국내: 서울) */
function nowIn(tz) {
  const f = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
  const p = Object.fromEntries(f.formatToParts(new Date()).map(x => [x.type, x.value]));
  return { date: `${p.year}-${p.month}-${p.day}`, hm: (+p.hour % 24) * 60 + (+p.minute) };
}
/* 해당 날짜(시장 현지 날짜)의 정규장이 끝나 종가가 확정됐는지 */
function isFinal(it, d) {
  const n = nowIn(it.market === 'US' ? 'America/New_York' : 'Asia/Seoul');
  const early = (EARLY[it.market] || {})[d];
  const close = early ? early + 5 : (it.market === 'US' ? 16 * 60 + 5 : 15 * 60 + 40);
  return d < n.date || (d === n.date && n.hm >= close);

function chartSvg(it, w) {
  if (!w || w.length < 2) return '';
  const d = w.slice(-40), W = 600, H = 220, P = 6;
  const vals = d.flatMap(b => [b.h, b.l, b.ma5, b.ma30].filter(x => x));
  const mx = Math.max(...vals), mn = Math.min(...vals);
  const y = v => P + (H - 2 * P) * (1 - (v - mn) / (mx - mn || 1));
  const bw = (W - 2 * P) / d.length;
  const x = i => P + bw * i + bw / 2;
  let s = '';
  d.forEach((b, i) => {
    const up = b.c >= b.o, col = up ? '#d23c3c' : '#2457c5';
    s += `<line x1="${x(i)}" x2="${x(i)}" y1="${y(b.h)}" y2="${y(b.l)}" stroke="${col}" stroke-width="1"/>`;
    s += `<rect x="${x(i) - bw * 0.35}" width="${bw * 0.7}" y="${y(Math.max(b.o, b.c))}" height="${Math.max(1, Math.abs(y(b.o) - y(b.c)))}" fill="${col}"/>`;
  });
  const line = (k, col) => { const pts = d.map((b, i) => b[k] ? `${x(i)},${y(b[k])}` : null).filter(Boolean).join(' '); return pts ? `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2"/>` : ''; };
  s += line('ma5', '#e07b00') + line('ma30', '#1d8a4e');
  return `<svg class="ch" viewBox="0 0 ${W} ${H}">${s}<text x="8" y="16" font-size="11" fill="#e07b00">— 5주선</text><text x="70" y="16" font-size="11" fill="#1d8a4e">— 30주선</text></svg>`;
}

  <div class="card"><h3>📘 하락장 대처법 풍차돌리기 설명서</h3>
   <div class="muted">하락장에서 보유 주식 일부를 나눠 팔고, 더 싼 가격에 같은 수량을 되사서 <b>주식 수는 지키면서 현금을 남기는</b> 방법입니다. 항목을 눌러 펼쳐 보세요.</div>
   <div class="row"><button class="btn s g" onclick="A.guideAll(1)">모두 펼치기</button><button class="btn s g" onclick="A.guideAll(0)">모두 접기</button></div></div>
  <div class="card gcard">
  ${sec('01', '풍차돌리기는 어떻게 작동하나요?', `
    ${flow(['사탕 1개를<br><b>50원</b>에 팔아요', '같은 사탕을<br><b>47원</b>에 다시 사요', '사탕 1개를 되찾고<br><b>3원</b>이 남아요'])}
    <p>반대로 <b>55원</b>에 되사면 55원 − 50원 = <b class="neg">5원 추가 지출</b>이 생깁니다.</p>
    <p>사탕 1개를 <b>SOXL 1주</b>라고 생각하면 됩니다. 팔았던 수량을 더 싸게 되사면 주식 수는 그대로이고 차액만큼 현금이 남습니다. 팔고 나서 오르면 되사는 데 돈이 더 듭니다.</p>`, '', true)}
  ${sec('02', '언제 시작하고 언제 쉬나요?', `
    <table class="gt"><tr><th>처음 시작</th><td>주봉 <b>시가와 종가가 모두 30주선 아래</b>, 종가가 시가보다 낮은 <b>음봉</b>(몸통 전체가 30주선 아래) → 1회차는 첫 주, 2회차는 다음 주</td></tr>
    <tr><th>3회차부터</th><td>1·2회차 중 한 회차가 <b>재매수를 완료</b>했고 <b>5주선 아래</b>라면, 그 물량으로 <b>다음 거래일</b>에 시작할 수 있습니다. 회차마다 시작 날짜가 달라집니다.</td></tr>
    <tr><th>새 회차 대기</th><td>주봉 <b>시가와 종가가 모두 5주선 위</b>면 판 수량의 <b>절반까지 채우고 대기</b>합니다.</td></tr></table>
    <p><b>확인 시점</b>: 미국 현지 <b>금요일 정규장 마감 후</b> SOXX와 SOXL의 확정 주봉을 함께 확인합니다. 금요일이 휴장이면 그 주 마지막 거래일에 확인합니다. (QQQ가 아니라 SOXX를 봅니다.)</p>
    <p><b>두 종목 중 하나만 조건을 충족하면</b>: 판정 기준이 정해져 있지 않습니다. 대부분은 함께 움직이지만, SOXX는 아닌데 SOXL만 조건을 충족하는 경우가 있을 수 있습니다. 이때는 본인이 판단합니다.</p>
    <p class="muted">풍차는 주봉 몸통 전체가 30주선을 하향 이탈할 때 돌기 시작합니다. 주 단위로 판단하니 대응이 다소 늦지만, 너무 일찍(하락 초입에) 들어가면 휩소에 걸릴 확률이 올라갑니다.</p>`,
    '[신호] 탭에서 종목·기준지수의 주봉, 5주선, 30주선과 판정 결과를 봅니다. 엇갈리면 "판단 필요"로 표시됩니다.')}
  ${sec('03', 'SOXL 400주로 풍차 시작하기', `
    ${flow(['400주 보유', '<b>200주</b> 그대로 보유', '<b>200주</b> 풍차에 사용<br>(100주씩 2개)'])}
    <p>200주를 계속 보유하는 이유는 <b>포지션을 중립</b>으로 만들기 위해서입니다. 각 회차는 100주를 <b>5거래일 동안 하루 20주씩 MOC로 매도</b>합니다.</p>
    <p>1회차는 첫 주, 2회차는 다음 주에 출발합니다. 2회차가 매도하는 동안에도 1회차 재매수는 체결될 수 있습니다.</p>
    <p><b>회차 번호는 출발 순서</b>입니다. 나중에 출발한 회차가 먼저 끝날 수도 있습니다. 예: 4회차가 재매수를 마치면 5회차가 시작될 수 있고, 그때 3회차는 아직 재매수를 기다리는 중일 수 있습니다.</p>`,
    '[설정]에서 총 수량 400, 코어 200, 슬롯 2를 넣으면 회차당 100주, 하루 20주가 자동 계산됩니다. 실전 예시는 1,600주 중 800주, 회차당 400주(하루 80주)로 비율이 같습니다.')}
  ${sec('04', '풍차돌리기 주문 방법', `
    <table class="gt"><tr><th>팔 때는 MOC</th><td>장 마감 시장가. 하루 20주씩 5거래일. 주문에 가격을 적지 않습니다.</td></tr>
    <tr><th>되살 때는 일반 지정가</th><td>5일 매도가 끝난 뒤 주문 5개. 주문마다 20주. 지정가 이하에서 체결됩니다.</td></tr></table>
    <p>예: <b>$47.50 지정가 매수</b> → $47.40에는 체결될 수 있고, $47.60에는 체결되지 않습니다.</p>
    <p>되살 때 지정가로 하는 이유는 될 수 있으면 빨리 주식을 회수하기 위해서입니다(휩소 대비). 지정가 매수라서 <b>프리장·정규장·애프터장·주간장</b> 어디서든 그 가격에 파는 사람이 있으면 체결됩니다. 기간잔량으로 약 1달 걸어 두는 것은 매일 주문을 넣기 번거로워서일 뿐입니다.</p>`,
    '[회차] 탭에서 매일 MOC 체결가를 입력하거나 [종가 자동채우기]를 누릅니다. 확정 종가만 채워집니다. 매도일은 주말과 휴장일(예: 추수감사절)을 건너뛰어 잡힙니다.')}
  ${sec('04-1', '매수 주문은 언제 걸어요?', `
    ${flow(['① 1회차 매도 완료<br>5거래일 20주씩 MOC<br>→ 평균 매도가 계산', '② 일반 지정가 매수 5개<br>예: $47.50 × 20주', '③ 약 한 달 체결 대기<br>기간잔량 예약매수'])}
    <p>증권사 앱에서 <b>주문 유효기간과 적용 세션</b>을 확인하세요. 기간이 끝나 다시 주문할 때는 <b>미체결 수량만</b> 넣습니다.</p>`,
    '5일 매도가 끝나면 지정가 5개가 자동으로 만들어집니다. 주문일로부터 30일이 지나면 "유효기간 만료 — 미체결 수량만 다시 넣으세요" 알림이 뜹니다.')}
  ${sec('05', '1회차 평균 매도가 구하기', `
    <table class="gt c"><tr><th>1일차</th><th>2일차</th><th>3일차</th><th>4일차</th><th>5일차</th></tr><tr><td>$52 × 20주</td><td>$51 × 20주</td><td>$50 × 20주</td><td>$49 × 20주</td><td>$48 × 20주</td></tr></table>
    <p>5거래일 동안 총 100주 매도, 받은 돈 합계 $5,000 → <b>$5,000 ÷ 100주 = 주당 $50</b></p>
    <p>날마다 체결 수량이 다르면 <b>실제로 받은 금액 합계 ÷ 실제로 판 수량</b>으로 나눕니다.</p>`,
    '평균단가는 실제로 매도한 수량 기준으로만 계산합니다. 5일 매도가 끝나기 전 지정가는 회색 "잠정"으로 표시됩니다.')}
  ${sec('06', '1회차 지정가 주문 5개', `
    <p>평균 매도가 $50, 매수 간격 5% → <b>n번째 주문가 = 평균 매도가 × (1 − 간격)ⁿ</b> (센트 단위 반올림)</p>
    <table class="gt c"><tr><th>매수1</th><th>매수2</th><th>매수3</th><th>매수4</th><th>매수5</th></tr><tr><td>$47.50</td><td>$45.13</td><td>$42.87</td><td>$40.73</td><td>$38.69</td></tr><tr><td>20주</td><td>20주</td><td>20주</td><td>20주</td><td>20주</td></tr></table>
    <p>100주 매도대금 $5,000 → 100주 재매수 비용 $4,298.40 → <b>100주를 되찾고 현금 $701.60이 남습니다.</b></p>
    <p>매수가 사이 간격은 <b>등비수열</b>입니다. 바로 위 가격에 0.95(5%일 때)를 곱해 다음 매수가를 정합니다.</p>
    <p class="muted">계산은 반올림 전 평단으로 이어서 곱합니다. 반올림한 값을 손으로 이어 곱하면 1센트 차이가 날 수 있습니다. (예: 6회차 평단 43.544 × 0.975² = 41.39, 반올림값 42.46 × 0.975 = 41.40)</p>`,
    '지정가와 실제 체결가를 따로 입력합니다. 이익은 실제 체결가로 계산합니다.')}
  ${sec('06-1', '회차가 바뀌면 매수가도 다시 계산해요', `
    <table class="gt c"><tr><th>1회차</th><th>2회차</th><th>3회차</th><th>4회차</th><th>5회차</th><th>6회차부터</th></tr><tr><td>5%</td><td>4.5%</td><td>4%</td><td>3.5%</td><td>3%</td><td>2.5%</td></tr></table>
    <p>예: 2회차 평균 매도가 $50, 간격 4.5% → $50 × 0.955 = <b>$47.75</b>가 첫 지정가</p>
    <p>매수 5칸은 같은 비율을 한 번씩 더 곱합니다. 2.5%는 매수 간격의 하한입니다. 시간이 갈수록 바닥이 가까워지므로 간격을 줄입니다.</p>
    <p><b>하락이 많이 진행된 뒤 늦게 진입할 때</b>는 처음부터 2.5% 간격으로 계산합니다.</p>
    <p class="muted">TQQQ, 미장·국장의 다른 3배 레버리지, 변동성이 큰 종목에 적용할 때는 그 종목의 변동성을 감안해 간격(이익률)을 조정합니다. 이 앱의 국내 기본값(3→1.5%)은 미국 기본값의 약 60%로 잡은 것입니다.</p>`,
    '[설정 → 회차별 매수 간격]에서 수정합니다. "늦게 진입" 체크 시 처음부터 마지막 간격을 씁니다.')}
  ${sec('07', '먼저 끝난 회차가 이어져요', `
    <p>400주 중 200주는 계속 보유하고, 나머지 200주를 100주씩 운용합니다.</p>
    <table class="gt"><tr><th>1회차 · 첫 주</th><td>100주를 5거래일 동안 하루 20주씩 매도 → 매도가 끝나면 1회차 재매수 대기</td></tr>
    <tr><th>2회차 · 다음 주</th><td>다른 100주도 하루 20주씩 5거래일 매도. 그동안 1회차 재매수는 진행될 수 있음</td></tr>
    <tr><th>3회차부터</th><td>먼저 100주를 다 되산 물량으로, 시작 조건이 맞으면 출발</td></tr></table>
    ${flow(['2회차가 먼저<br>100주 재매수 완료', '그 100주로<br><b>3회차</b> 시작', '3회차도 먼저 끝나면<br>그 물량으로 <b>4회차</b>'])}
    <p>이때 1회차는 아직 재매수 대기 중일 수 있습니다. 4회차 이후도 같은 방식입니다.</p>
    <p><b>3회차부터는 정해진 주간 간격이 없습니다.</b> 해당 물량을 모두 되사고 5주선 아래 등 새 회차 조건이 맞으면 다음 거래일에 그 물량으로 시작할 수 있습니다. <b>두 회차가 동시에 끝나면</b> 2~3일 차이를 두고 출발합니다.</p>`,
    '[대시보드 → 다음 회차]가 먼저 비는 슬롯, 회차 번호, 간격, 출발 가능일을 자동으로 알려줍니다.')}
  ${sec('08', '5주선을 회복했다가 다시 내려오면?', `
    <p class="muted">미국 금요일 장 마감 후 SOXX·SOXL 주봉으로 확인합니다.</p>
    ${flow(['① 5주선 위로<br>몸통 전체 회복<br>→ <b>50%까지 채우고 대기</b>', '② 5주선 재이탈<br>→ 같은 회차 남은 50주<br><b>지정가 재매수 재개</b>', '③ 100주 전량 재매수<br>→ 조건 확인 후<br><b>다음 회차 출발</b>'])}
    <p>예: 100주를 팔았고 40주가 이미 체결됐다면 10주를 더 사서 50주로 맞추고 대기합니다(40주 + 10주 = 50주). 다시 하락할 수 있기 때문입니다. <b>이미 50% 이상 매수했다면 추가 매수 없이 대기</b>합니다.</p>
    <p>회차 매도를 시작했다면 중간에 5주선을 회복해도 <b>5거래일 매도는 끝까지</b> 마칩니다.</p>
    <p>5주선 재이탈 때는 <b>대기 중인 회차의 미체결 매수만</b> 이어갑니다. 이것은 같은 회차 안에서 진행되는 일이고, 새 회차 시작은 전량 재매수 후 따로 판단합니다.</p>`,
    '[회차] 탭 → "5주선 회복 처리"로 부족분을 매수하면 높은 지정가 주문부터 수량이 줄어듭니다. 재이탈 시 "주문 재개"를 누르면 남은 수량을 원래 지정가로 다시 겁니다.')}
  ${sec('08-1', '풍차를 완전히 끝낼 때 (STOP)', `
    ${flow(['30주선 위로<br>주봉 몸통 전체 안착<br>(시가·종가 모두 위)', '상승장 전환으로 봐요', '아직 못 되산 수량 + 차익금<br><b>5거래일에 나눠 종가 매수</b>'])}
    <p>차익금으로 SOXL 수량을 더 늘립니다. 30주선은 약 150거래일에 해당하는 기간으로, 풍차의 상승장·하락장 경계입니다.</p>
    <p>이 방식은 회차가 진행될수록 이익금이 쌓이는 구조라 한번 시작하면 중독성이 있어 그만두기가 쉽지 않습니다. 그래서 STOP 시점을 정해 놓은 것입니다. 상승장에서는 매도 후 되사지 못할 확률이 올라가므로, 상승장으로 전환되면 멈춥니다.</p>`,
    'STOP 신호가 나오면 대시보드에 알림이 뜹니다. [STOP 처리]를 누르면 미회수 수량과 현금으로 살 수 있는 수량, 5일 분할 매수표가 만들어집니다.')}
  ${sec('09', '계좌가 본전이 되는 과정', `
    ${flow(['팔았던 주식을<br>더 싸게 되사요', '주식 수를 되찾고<br>현금이 남아요', '지금 주식 가치에<br>남은 현금을 더해요'])}
    <p>이 방법은 돈을 벌기 위한 것이라기보다, <b>하락장에서 덜 잃고 살아남기 위한 고육책</b>입니다.</p>`,
    '[대시보드]의 "계좌 평가(주식+현금)", "풍차 안 했을 때 대비", "본전 주가"(원래 매입단가 입력 시)에서 확인합니다.')}
  ${sec('10', '개선안 (실험) — 약점 보완 규칙', `
    <p>백테스트에서 이 방법은 <b>길게 이어지는 하락장(2022년)에서는 크게 이기고</b>, <b>급락 후 V자 반등(2018년, 2025년)에서는 조금 지는</b> 모습을 보였습니다. 지는 이유는 바닥 근처에서 판 물량을 되사지 못하고, STOP 때 비싸게 되사기 때문입니다. 아래 개선안은 이 약점을 줄이려는 <b>실험용 규칙</b>입니다.</p>

  if (BTB && !BTB.cols) {
    out += `<div class="card"><h3>③ 하락장 구간 일괄 결과 — ${esc(P.ticker)}</h3><div class="tw"><table class="x"><tr><th>구간</th><th>기간</th><th>그냥 보유</th><th>풍차</th><th>차이</th><th>주식 수 변화</th><th>회차</th><th>STOP</th><th>MDD (풍차/보유)</th></tr>` +
      BTB.map(b => { const x = b.res; if (x.err) return `<tr><td class="c">${b.n}</td><td colspan="8" class="c muted">${esc(x.err)}</td></tr>`; const ds = x.hold - x.total0; return `<tr><td class="c">${b.n}</td><td class="c">${x.d0.slice(2)}~${x.d1.slice(2)}</td><td class="${cls(x.retB)}">${pct(x.retB, 1)}</td><td class="${cls(x.retS)}">${pct(x.retS, 1)}</td><td class="${cls(x.retS - x.retB)}"><b>${((x.retS - x.retB) * 100).toFixed(1)}%p</b></td><td class="${cls(ds)}">${ds >= 0 ? '+' : ''}${ds}주</td><td>${x.rounds.length}</td><td>${x.cycles.filter(c => c.stopIdx != null).length}</td><td>${pct(x.mddS, 0)} / ${pct(x.mddB, 0)}</td></tr>`; }).join('') +
      `</table></div><div class="muted" style="margin-top:6px">구간 날짜는 대략적인 하락장 구간입니다. [기간 선택 → 직접 입력]으로 원하는 구간을 따로 볼 수 있습니다. 각 구간은 시작일에 ${num(P.totalQty)}주를 보유한 상태에서 따로 계산합니다.</div></div>`;
  }
  out += `<div class="card"><h3>계산 가정</h3><ul class="muted">
   <li>MOC 매도는 그날 종가로 체결합니다.</li>
   <li>지정가 매수는 시가가 지정가 이하면 시가에, 장중 저가가 지정가 이하면 지정가에 체결한 것으로 봅니다. 프리장·애프터장 체결은 일봉에 없어 반영하지 못합니다.</li>
   <li>주봉 신호는 그 주 마지막 거래일 종가가 확정된 뒤 다음 거래일부터 적용합니다. 5주선 회복 때 50% 채우는 매수는 다음 거래일 시가로 계산합니다.</li>
   <li>STOP은 다음 5거래일 종가로 미회수 수량을 나눠 되사고, 남은 현금으로 살 수 있는 만큼 더 삽니다. 수량은 매일 그날 가격과 남은 현금으로 다시 계산합니다. 이후 새 시작 신호가 나오면 늘어난 주식 수로 풍차를 다시 시작합니다.</li>
   <li>개선안 ②(반등 추격)·⑥(재투자)의 매수는 조건이 확인된 다음 거래일 시가로 계산합니다. ①·⑦은 전날 종가와 직전 주봉 30주선으로 판단합니다. ⑤의 변동폭은 출발 전날까지의 20일 일봉으로 계산합니다.</li>
   <li>가격은 야후·네이버의 액면분할 반영 가격입니다. 배당과 환율은 반영하지 않습니다. 기간잔량 주문은 만료 없이 이어진 것으로 봅니다.</li>
   <li>과거 결과가 앞으로의 수익을 보장하지 않습니다.</li></ul></div>`;
  return out;
}
Object.assign(A, {
  btSet(k, v, t) {
    const P = BTP(); P[k] = t === 'number' ? num(v) : v;
    if (k === 'market') { P.gaps = (v === 'US' ? GAP_US : GAP_KR).slice(); P.preset = 0; P.start = BT_PRE[v][0].s; P.end = BT_PRE[v][0].e; }
    if (k === 'start' || k === 'end') P.preset = -1;
    render();
  },
  btGap(i, v) { BTP().gaps[i] = num(v); render(); },
  btGapReset(m) { BTP().gaps = (m === 'US' ? GAP_US : GAP_KR).slice(); render(); },
  btPreset(k) { const P = BTP(); P.preset = +k; const p = (BT_PRE[P.market] || BT_PRE.US)[+k]; if (p) { P.start = p.s; P.end = p.e; } render(); },
  btFromItem() { const P = BTP(), d = btDefaults(IT()); ['market', 'krType', 'ticker', 'indexTicker', 'totalQty', 'coreQty', 'slots', 'sellDays', 'gaps', 'buyFee', 'sellFee', 'sellTax', 'minGap', 'adv'].forEach(k => P[k] = d[k]); toast('현재 종목 설정(개선안 포함)을 가져왔습니다'); render(); },
  btAdv(k, v, t) { const P = BTP(); P.adv = advOf(P); P.adv[k] = t === 'number' ? num(v) : v; render(); },
  btAdvToItem() { const it = IT(); if (!confirm(`백테스트의 개선안 설정을 실전 종목 "${it.name || it.ticker}"에 적용할까요?`)) return; const old = advOf(it); it.adv = { ...advOf(BTP()) }; it.adv.on6Since = it.adv.on6 ? (old.on6 && old.on6Since ? old.on6Since : today()) : ''; toast('실전 종목에 개선안을 적용했습니다'); render(); },
  async btLoad() {
    const P = BTP();
    if (!S.webappUrl) return toast('[설정]에서 웹앱 URL을 먼저 입력하세요');
    const pre = P.market === 'KR' ? 'KR:' : 'US:';
    const syms = [P.ticker, P.indexTicker].filter(x => String(x || '').trim()).map(x => pre + String(x).trim().toUpperCase());
    if (!syms.length) return toast('티커를 입력하세요');
    toast('전체 일봉을 불러오는 중… (10초 이상 걸릴 수 있음)');
    try {
      const res = await fetch(S.webappUrl + (S.webappUrl.includes('?') ? '&' : '?') + 'range=max&symbols=' + encodeURIComponent(syms.join(',')));
      const j = await res.json(), t = j.data && j.data[syms[0]], x = syms[1] && j.data && j.data[syms[1]];
      if (!t || !t.ok) throw new Error(syms[0] + ': ' + (t ? t.error : '응답 없음'));
      BTD.t = t.daily; BTD.i = x && x.ok ? x.daily : null; BTD.key = syms.join(','); BTD.src = '웹앱';
      BTD.at = new Date().toLocaleDateString('ko-KR');
      try { localStorage.setItem('wm_btd', JSON.stringify(BTD)); } catch (e) { }
      BTR = BTB = null; render();
      if (dataGap(BTD.t) > 4) toast('일봉이 아닌 데이터가 왔습니다. Apps Script 코드를 새로 복사해 새 버전으로 재배포하세요');
      else if (BTD.t[0][0] > addDays(today(), -400)) toast('1년치만 받아졌습니다. Apps Script 코드를 새 버전으로 다시 배포하세요 ([설정] 탭 코드 복사)');
      else toast(`불러오기 완료${syms[1] && !BTD.i ? ' (기준지수 실패: ' + (x ? x.error : '응답 없음') + ')' : ''}`);
    } catch (e) { toast('불러오기 실패: ' + e.message + ' — CSV로 넣어 주세요'); }
  },
  btCsv(w, file) {
    if (!file) return;
    const fr = new FileReader();
    fr.onload = () => {
      const rows = parseCsv(fr.result);
      if (!rows || rows.length < 40) return toast('CSV를 읽지 못했습니다 (날짜·종가 열 필요)');
      BTD[w] = rows; BTD.src = 'CSV'; BTD.at = file.name;
      try { localStorage.setItem('wm_btd', JSON.stringify(BTD)); } catch (e) { }
      BTR = BTB = null; toast(`${w === 't' ? '종목' : '기준지수'} ${rows.length}일 불러옴`); render();
    };
    fr.readAsText(file);
  },
  btRunOne() {
    const P = BTP();
    if (!BTD.t) return toast('먼저 데이터를 불러오세요');
    const pre = (BT_PRE[P.market] || BT_PRE.US)[+P.preset];
    const a = advOf(P), on = anyAdv(a);
    const main = btRun(P, BTD.t, BTD.i, { adv: a });
    let cmp = null;
    if (on && !main.err) {
      cmp = [{ label: '원래 규칙', res: btRun(P, BTD.t, BTD.i, { adv: advNone(a) }) }, { label: '<b>개선안 (켠 것 전부)</b>', res: main }];
      if (P.eachAdv) ADV_KEYS.filter(k => a[k]).forEach(k => cmp.push({ label: ADV_NAME[k] + ' 단독', res: btRun(P, BTD.t, BTD.i, { adv: advOnly(a, k) }) }));
    }
    BTR = { main, cmp, title: pre ? pre.n : '직접 입력', vars: P.compare && !main.err ? [{ label: '기본', res: main }, { label: '×0.8 (좁게)', res: btRun(P, BTD.t, BTD.i, { mul: 0.8, adv: a }) }, { label: '×1.2 (넓게)', res: btRun(P, BTD.t, BTD.i, { mul: 1.2, adv: a }) }] : null };
    BTB = null; render();
  },
  btBatch() {
    const P = BTP();
    if (!BTD.t) return toast('먼저 데이터를 불러오세요');
    const a = advOf(P), on = anyAdv(a);
    const cols = [{ label: '원래 규칙', adv: advNone(a) }];
    if (on) { cols.push({ label: '개선안 전부', adv: a }); if (P.eachAdv) ADV_KEYS.filter(k => a[k]).forEach(k => cols.push({ label: ADV_NAME[k].slice(0, 1) + ' 단독', adv: advOnly(a, k) })); }
    BTB = { cols, rows: (BT_PRE[P.market] || BT_PRE.US).map(p => ({ n: p.n, res: cols.map(c => btRun({ ...P, start: p.s, end: p.e }, BTD.t, BTD.i, { adv: c.adv })) })) };
    BTR = null; render();
  }
});

render();
// 웹앱 URL이 설정된 경우 최초 실행 후 시세를 조회하고 5분마다 자동 갱신합니다.
if (S.webappUrl) setTimeout(() => A.refresh(true), 800);
// 화면이 보일 때만 5분마다 갱신. 입력 중에는 화면을 다시 그리지 않고 입력이 끝난 뒤 반영합니다.
setInterval(() => { if (S.webappUrl && !document.hidden) A.refresh(true); }, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.webappUrl && Date.now() - LAST_REF > 5 * 60 * 1000) A.refresh(true); });
document.addEventListener('focusout', () => setTimeout(() => { if (PEND && !editing()) { PEND = false; render(); } }, 400));
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
</body>
</html>
